# Temporary: which part of joining kept segments into an MP4 crashes ffmpeg on
# Linux (SIGSEGV in test/cache.test.ts since 0.35.0). Run by hand; delete after.
name: Diagnose remux

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Ubuntu's ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Variants
        shell: bash
        run: |
          STATIC=$(node -e "console.log(require('ffmpeg-static'))")
          for F in "$STATIC" /usr/bin/ffmpeg; do
            echo "=== $F: $("$F" -version | head -1)"
            D=$(mktemp -d)
            "$F" -v error -f lavfi -i testsrc2=size=320x540:rate=12 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 30 \
              -pix_fmt yuv420p -c:v libx264 -c:a aac -f segment -segment_time 6 -segment_format mpegts "$D/%d.ts" || echo "segmenting failed: $?"
            ls "$D"
            try() { name=$1; shift; cat "$D"/[0-9].ts | "$F" -hide_banner -v error -y -f mpegts -i pipe:0 -map 0 -c copy "$@" "$D/out.mp4"; echo "$name: exit $?"; }
            try "plain"
            try "bsf" -bsf:a aac_adtstoasc
            try "faststart" -movflags +faststart
            try "bsf+faststart" -bsf:a aac_adtstoasc -movflags +faststart -f mp4
            try "concat-protocol" -bsf:a aac_adtstoasc -f mp4
            "$F" -hide_banner -v error -y -i "concat:$(ls "$D"/[0-9].ts | paste -sd'|')" -map 0 -c copy -bsf:a aac_adtstoasc -movflags +faststart -f mp4 "$D/out2.mp4"; echo "concat: protocol exit $?"
            "$F" -hide_banner -v error -y -i "$D/0.ts" -map 0 -c copy -movflags +faststart -f mp4 "$D/one.mp4"; echo "one segment from a file: exit $?"
          done
      - name: The cache tests on Ubuntu's ffmpeg
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
        run: npx vitest run test/cache.test.ts
