name: Tests

# typecheck + lint + every Vitest suite, on every push to main and every pull
# request. docker.yml calls this for a release tag and publishes only when it passes.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the runtime the image ships (Dockerfile: node:26-slim).
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      # The distribution's ffmpeg, as the image ships (Dockerfile: Debian's), not
      # the ffmpeg-static npm build: its Linux binary (johnvansickle 7.0.2-static)
      # crashes with SIGSEGV on every MPEG-TS → MP4 remux, which failed the
      # download-copy tests and kept 0.35.0 and 0.36.0 from publishing.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
        run: npm test
