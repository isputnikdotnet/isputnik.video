name: Build & publish Docker image

# Tags publish an image to ghcr.io; pushes to main and pull requests build the
# same image and throw it away, so packaging breaks on an ordinary commit rather
# than at release time.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-push:
    needs: tests
    if: >-
      !cancelled()
      && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
      && (github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Is this a release?
        id: release
        run: echo "publish=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same release image also goes to Docker Hub, as isputnik.home's does.
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with Read, Write,
      # Delete scope, not the account password) are repository secrets; without
      # them a tag build fails here and publishes nothing, so add them before
      # tagging. The image name is spelled out below rather than built from the
      # username secret: Dependabot and fork PRs get no secrets, and their dry
      # runs would get an invalid name. ghcr.io stays the one the Unraid template
      # (isputnik-video.xml) pulls.
      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/isputnikdotnet/isputnik.video
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build${{ steps.release.outputs.publish == 'true' && ' and push' || ' (dry run)' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.release.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Docker Hub repository page shows README.md, its relative links rewritten
      # to absolute GitHub URLs so they resolve there, under a short description that
      # says what this is: an add-on for isputnik.home (the owner's rule for every
      # public description of a companion container). The image is already out by
      # now, so a refusal here must not fail the release.
      - name: Update the Docker Hub description
        if: steps.release.outputs.publish == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: isputnikdotnet/isputnik.video
          short-description: "Add-on for isputnik.home: its video engine for shows and movies. Needs the isputnik.home container."
          readme-filepath: ./README.md
          enable-url-completion: true
